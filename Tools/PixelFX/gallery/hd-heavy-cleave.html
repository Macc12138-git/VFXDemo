<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重击剑光 · 高清手绘</title>
<style>
:root{color-scheme:dark;font:14px/1.6 system-ui,sans-serif;color:#e9e2d9;background:#0c0e13}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;font-weight:550;margin:3px 0}p{margin:0;color:#a99f96;font-size:13px}a{color:#f1bc80;text-decoration:none}.eyebrow{font-size:10px;letter-spacing:.2em;color:#ce956b}.stage{margin-top:20px;position:relative;background:#11151e;border:1px solid #30323a;border-radius:12px;overflow:hidden}.stage canvas{display:block;width:100%;aspect-ratio:4/3;max-height:63vh;object-fit:contain}.label{position:absolute;top:15px;left:18px;font-size:10px;letter-spacing:.12em;color:#9b9188;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}button,select{background:#1c1d23;color:#ded4c8;border:1px solid #44413d;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}button.active{border-color:#d99c62;color:#ffcf93}label{font-size:12px;color:#bcb0a3}input{accent-color:#e5a25f}.timeline{display:flex;align-items:center;gap:10px;margin-top:13px}.timeline input{flex:1}output{font:12px ui-monospace,monospace;color:#c7ab89}.panel{display:flex;flex-wrap:wrap;gap:15px;margin-top:14px;padding:13px 16px;border:1px solid #302c2a;border-radius:8px}.panel input[type=range]{width:95px;vertical-align:middle}.colors input{width:29px;height:26px;border:0;padding:0;vertical-align:middle;background:none}.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.phases button{text-align:left;padding:12px 14px}.phases small{display:block;font-size:11px;color:#9c8b78}.note{font-size:11px;color:#8d8277;margin-top:14px}@media(max-width:650px){main{padding:16px}header{align-items:flex-start}h1{font-size:20px}.stage canvas{max-height:55vh}.phases{gap:6px}.phases button{padding:8px;font-size:12px}}
</style>
<main>
<header><div><span class="eyebrow">PIXELFX / HEAVY CLEAVE</span><h1>重击剑光 · 高清手绘</h1><p>橙红厚弧、奶白刃缘、内侧细弧与顺势笔触。</p></div><a href="/gallery/workbench.html">作品工作台 ↗</a></header>
<div class="stage"><span class="label">HEAVY CLEAVE · HAND PAINTED</span><canvas id="effect" width="1024" height="768" aria-label="高清手绘重击剑光动态预览"></canvas></div>
<div class="controls"><button id="play">暂停</button><button id="again">重播</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="speed" aria-label="播放速度"><option value="1">1× 正常</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 慢放</option><option value="0.1">0.1× 慢放</option></select><select id="bg" aria-label="背景"><option value="dark">深色背景</option><option value="gray">灰色背景</option><option value="light">浅色背景</option><option value="warm">暖色背景</option><option value="checker">透明棋盘</option></select><select id="size" aria-label="预览尺寸"><option value="full">放大检查</option><option value="384">384 px</option><option value="192">192 px</option><option value="96">96 px</option></select><label><input id="repeat" type="checkbox" checked> 循环预览</label></div>
<div class="timeline"><input id="time" type="range" min="0" max="0.52" step="0.001" value="0" aria-label="逐帧时间"><output id="clock">0.000 / 0.520 s</output></div>
<div class="panel" id="layers"><label><input type="checkbox" data-layer="body" checked> 橙红厚弧</label><label><input type="checkbox" data-layer="edge" checked> 白热刃缘</label><label><input type="checkbox" data-layer="brush" checked> 手绘笔触</label><label><input type="checkbox" data-layer="echo" checked> 内侧细弧</label><label><input type="checkbox" data-layer="glow" checked> 贴边微光</label></div>
<div class="panel"><label>厚度 <input id="thickness" type="range" min="0.7" max="1.3" step="0.01" value="1" aria-label="剑光厚度"></label><label>笔触 <input id="brush" type="range" min="0" max="1" step="0.01" value="0.78" aria-label="手绘笔触强度"></label><label>微光 <input id="glow" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="微光强度"></label><button id="reset">恢复默认</button><span class="colors"><label>暗部 <input type="color" data-color="shadow" value="#9a292c" aria-label="暗部颜色"></label> <label>主色 <input type="color" data-color="body" value="#f47732" aria-label="主色颜色"></label> <label>亮部 <input type="color" data-color="hot" value="#ffd578" aria-label="亮部颜色"></label> <label>刃缘 <input type="color" data-color="edge" value="#fff9df" aria-label="刃缘颜色"></label></span></div>
<div class="phases"><button data-time="0.10">① 加速下劈<small>0–135 ms · 弧线迅速展开</small></button><button data-time="0.16">② 厚弧峰值<small>135–185 ms · 白热刃缘压住橙红主形</small></button><button data-time="0.29">③ 收笔消散<small>185 ms 后 · 尾端追赶、退热、归空</small></button></div>
<p class="note">由 Heavy cleave 提取剑光独立重绘。1024 × 768 · 可分层、逐帧与调色。</p>
</main>
<script type="module" src="heavy-cleave-preview.js"></script>
</html>
