<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavy cleave · 原版轨迹高清手绘</title>
<style>
:root{color-scheme:dark;font:14px/1.55 system-ui,sans-serif;color:#e8e1d8;background:#0d0f14}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:22px 26px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px;font-weight:550;margin:3px 0}p{margin:0;color:#a89c8f;font-size:12px}a{color:#e8b57d;text-decoration:none}.eyebrow{font-size:10px;letter-spacing:.17em;color:#c69670}.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stages.solo{grid-template-columns:1fr}.stages.solo .source{display:none}.stage{position:relative;background:#15171e;border:1px solid #33333a;border-radius:11px;overflow:hidden}.stage canvas{display:block;width:100%;aspect-ratio:4/3;max-height:60vh;object-fit:contain}.badge{position:absolute;top:12px;left:14px;font-size:11px;color:#b7ab9b;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:13px}button,select{padding:7px 11px;background:#1d1e24;border:1px solid #42403d;border-radius:6px;color:#ded4c7;font:inherit;cursor:pointer}label{font-size:12px;color:#b5a797}input{accent-color:#e6a365}.timeline{display:flex;gap:10px;align-items:center;margin-top:12px}.timeline input{flex:1}output{font:12px ui-monospace,monospace;color:#bba38b}.panel{display:flex;flex-wrap:wrap;gap:15px;padding:11px 14px;border:1px solid #34302d;border-radius:8px;margin-top:12px}.panel input[type=range]{width:90px;vertical-align:middle}.panel input[type=color]{width:28px;height:25px;padding:0;border:0;vertical-align:middle;background:none}.phases{display:flex;gap:8px;margin-top:13px}.phases button{flex:1;text-align:left;font-size:12px}.phases small{display:block;font-size:10px;color:#978575}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:14px;font-size:11px;color:#8f8275}@media(max-width:650px){main{padding:16px}h1{font-size:20px}.stages{gap:6px}.badge{top:8px;left:9px;font-size:10px}.phases button{padding:7px}}
</style>
<main>
<header><div><span class="eyebrow">PIXELFX / HEAVY CLEAVE · V3</span><h1>重击刀光 · 原版轨迹手绘</h1><p>保留原版从左上越顶、向右下劈落的方向与节奏</p></div><a href="/gallery/workbench.html">作品工作台 ↗</a></header>
<div class="stages" id="stages"><div class="stage source"><span class="badge">原版 · 仅刀光</span><canvas id="reference" width="1024" height="768" aria-label="原版 Heavy cleave 刀光同步对照"></canvas></div><div class="stage"><span class="badge">高清手绘 · 宽头 / 亮刃 / 撕裂后段</span><canvas id="effect" width="1024" height="768" aria-label="原版轨迹高清重击刀光动态预览"></canvas></div></div>
<div class="controls"><button id="play">暂停</button><button id="again">重播</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="speed" aria-label="播放速度"><option value="1">1× 正常</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 慢放</option><option value="0.1">0.1× 慢放</option></select><select id="view" aria-label="对照模式"><option value="compare">原版同步对照</option><option value="solo">仅看高清新版</option></select><select id="bg" aria-label="背景"><option value="dark">深色背景</option><option value="gray">灰色背景</option><option value="light">浅色背景</option><option value="warm">暖色背景</option><option value="checker">透明棋盘</option></select><select id="size" aria-label="预览尺寸"><option value="full">放大检查</option><option value="384">384 px</option><option value="192">192 px</option><option value="96">96 px</option></select><label><input id="repeat" type="checkbox" checked> 循环预览</label></div>
<div class="timeline"><input id="time" type="range" min="0" max="0.52" step="0.001" value="0" aria-label="逐帧时间"><output id="clock">0.000 / 0.520 s</output></div>
<div class="panel"><label><input type="checkbox" data-layer="body" checked> 主色块</label><label><input type="checkbox" data-layer="shadow" checked> 局部暗笔</label><label><input type="checkbox" data-layer="tail" checked> 撕裂拖尾</label><label><input type="checkbox" data-layer="echo" checked> 原版内弧余影</label><label><input type="checkbox" data-layer="edge" checked> 锋利亮边</label><label><input type="checkbox" data-layer="glow" checked> 贴边微光</label></div>
<div class="panel"><label>刀长 <input id="bladeLength" type="range" min="140" max="240" step="1" value="176" aria-label="前端刀长"></label><label>撕裂 <input id="tear" type="range" min="0" max="1" step="0.01" value="1" aria-label="撕裂深度"></label><label>微光 <input id="glow" type="range" min="0" max="0.5" step="0.01" value="0.12" aria-label="微光强度"></label><button id="reset">恢复默认</button><label>主色 <input type="color" data-color="body" value="#f47732" aria-label="主色颜色"></label><label>暗部 <input type="color" data-color="shadow" value="#9d302b" aria-label="暗部颜色"></label><label>亮边 <input type="color" data-color="edge" value="#fff3d1" aria-label="亮边颜色"></label></div>
<div class="phases"><button data-time="0.06">① 左上起势<small>两侧使用同一挥砍时钟</small></button><button data-time="0.10">② 越顶下劈<small>沿原版轨迹顺时针加速</small></button><button data-time="0.16">③ 重击停留<small>查看宽头与外沿亮刃</small></button><button data-time="0.29">④ 收尾<small>后段沿原弧追赶消退</small></button></div>
<div class="footer"><span>独立刀光 · 原版挥砍阶段同步 · 1024 × 768 · 60 fps</span><span><a href="/gallery/hd-heavy-cleave.html">V1 旧稿 ↗</a></span></div>
</main><script type="module" src="heavy-cleave-v3-preview.js"></script>
</html>
